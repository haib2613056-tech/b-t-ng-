<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi mẹ yêu · 20/10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap">
<style>
:root{
  --bg1:#FFE3EB;--bg2:#FFF7F4;--ink:#5A1F37;--soft:#8A4A60;--rose:#D6336C;--pink:#F6A5BE;--blush:#FFD3DF;
  --pearl:#FFFDFB;--gold:#D9A07A;--card:rgba(255,255,255,.82);--shadow:rgba(214,51,108,.25);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#3A1226;--bg2:#220A16;--ink:#FFE6EE;--soft:#E9B5C6;--rose:#FF7AA5;--blush:#5A2039;--card:rgba(60,20,40,.78);--shadow:rgba(255,122,165,.3)}}
:root[data-theme="dark"]{--bg1:#3A1226;--bg2:#220A16;--ink:#FFE6EE;--soft:#E9B5C6;--rose:#FF7AA5;--blush:#5A2039;--card:rgba(60,20,40,.78);--shadow:rgba(255,122,165,.3)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 8%,var(--bg1),transparent 55%),radial-gradient(circle at 90% 95%,var(--blush),transparent 55%),var(--bg2);background-attachment:fixed;overflow-x:hidden;touch-action:manipulation}
.sc{display:none;min-height:100vh;min-height:100dvh;padding:24px 16px 36px;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.sc.on{display:flex;animation:in .6s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
h1,h2{font-family:'Dancing Script','Be Vietnam Pro',cursive;color:var(--rose);line-height:1.15}
h1{font-size:clamp(46px,15vw,80px)}h2{font-size:clamp(30px,9vw,44px)}
p.sub{max-width:30ch;color:var(--soft);line-height:1.6;font-size:16px}
.btn{font:600 17px 'Be Vietnam Pro',sans-serif;border:0;border-radius:999px;min-height:54px;padding:0 38px;color:#fff;background:linear-gradient(135deg,#F06595,var(--rose));box-shadow:0 10px 24px var(--shadow);cursor:pointer}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.opt:focus-visible,.pick:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.big{font-size:84px;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-9px)}}

/* Rương */
.chest{position:relative;width:190px;height:140px;margin:4px 0}
.lid{position:absolute;left:0;top:0;width:190px;height:66px;border-radius:95px 95px 10px 10px/58px 58px 10px 10px;background:linear-gradient(180deg,#F8BFD0,#E9759B);border:4px solid var(--gold);transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1);z-index:2}
.lid::after{content:"";position:absolute;left:0;right:0;top:46%;height:9px;background:var(--gold)}
.base{position:absolute;left:0;top:62px;width:190px;height:78px;border-radius:8px 8px 18px 18px;background:linear-gradient(180deg,#F29AB5,#D6336C);border:4px solid var(--gold);box-shadow:0 16px 28px var(--shadow)}
.base::before{content:"";position:absolute;left:calc(50% - 17px);top:-8px;width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#F3D2B6,var(--gold));border:3px solid #fff8}
.glow{position:absolute;left:10%;top:30px;width:80%;height:50px;border-radius:50%;background:radial-gradient(#fff,transparent 70%);opacity:0;transition:opacity 1s;z-index:1}
.chest.open .lid{transform:rotateX(115deg)}.chest.open .glow{opacity:1}
.chest.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.dials{display:flex;gap:10px}
.dial{width:58px;height:70px;border-radius:16px;display:grid;place-items:center;font:700 32px 'Be Vietnam Pro',sans-serif;color:var(--rose);background:var(--pearl);border:3px solid var(--gold);box-shadow:inset 0 6px 12px var(--blush),0 8px 16px var(--shadow)}
.dial.set{background:linear-gradient(180deg,#fff,var(--blush));color:#5A1F37}
.qcard{width:100%;max-width:440px;padding:20px 16px;border-radius:26px;background:var(--card);box-shadow:0 14px 34px var(--shadow);border:1px solid #fff6;text-align:left}
.qcard .n{font-size:14px;color:var(--soft);margin-bottom:6px}
.qcard .q{font-weight:600;font-size:18px;line-height:1.45;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;margin-top:10px;padding:10px 14px;border-radius:16px;border:2px solid var(--pink);background:var(--pearl);color:#5A1F37;font:500 16px/1.35 'Be Vietnam Pro',sans-serif;text-align:left;cursor:pointer;transition:background .2s}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--rose);font-size:14px}
.opt:active{background:var(--blush)}
.opt.bad{background:#FFD6DE;border-color:#E03A5A}.opt.good{background:#D9F5E4;border-color:#2E9E62}
.msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--rose);font-weight:500;text-align:center}

/* Quà */
.stageR{display:flex;flex-direction:column;align-items:center;gap:18px}
.pick{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font:500 16px/1.4 'Be Vietnam Pro',sans-serif;padding:6px;border-radius:24px}
.pick small{color:var(--soft);font-size:14px}
.pick svg{width:min(74vw,290px);height:auto;overflow:visible;animation:fl 4.2s ease-in-out infinite;filter:drop-shadow(0 14px 14px var(--shadow))}
.pick:nth-child(2) svg{animation-delay:-2s}
.lid3{transition:transform .5s cubic-bezier(.3,1.5,.5,1);transform-origin:150px 150px}
.lid3.pop{transform:translateY(-52px) rotate(-7deg)}
@media (hover:hover){.pick:hover .lid3{transform:translateY(-16px)}.pick:hover .lid3.pop{transform:translateY(-52px) rotate(-7deg)}}
.stw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.5)}}
@media (min-width:720px){.stageR{flex-direction:row;gap:48px}}

/* Tim rơi */
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.h{position:absolute;top:-40px;animation:fall linear forwards;filter:drop-shadow(0 2px 4px rgba(214,51,108,.5))}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}

/* Thư */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(90,31,55,.55)}
.ov.on{display:flex}
.paper{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;padding:30px 22px max(28px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:linear-gradient(180deg,#FFFDFB,#FFEFF3);color:#5A1F37;text-align:left;box-shadow:0 -20px 50px rgba(0,0,0,.3);animation:up .5s ease}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media (min-width:600px){.ov{align-items:center;padding:16px}.paper{border-radius:24px}}
.paper h2{font-size:38px;margin-bottom:8px}
.paper p{font-family:'Dancing Script','Be Vietnam Pro',cursive;font-size:23px;line-height:1.5;margin-bottom:10px;font-weight:600}
.photo{margin:16px auto 6px;width:min(270px,84%);padding:10px 10px 30px;background:#fff;box-shadow:0 10px 24px rgba(214,51,108,.3);transform:rotate(-3deg)}
.photo img,.photo .ph{display:grid;width:100%;aspect-ratio:4/5;object-fit:cover;background:linear-gradient(135deg,#FFD3DF,#FFF);place-items:center;color:#8A4A60;font:14px 'Be Vietnam Pro',sans-serif;text-align:center;padding:12px}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:0;background:#FFD3DF;color:#D6336C;font-size:20px;cursor:pointer}
.sig{text-align:right}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEBD2"/><stop offset="1" stop-color="#E5AD82"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#84CB95"/><stop offset="1" stop-color="#3C8B56"/></linearGradient>
<radialGradient id="g0" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFC2D6"/><stop offset="1" stop-color="#EE5A8F"/></radialGradient>
<radialGradient id="g1" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFC4D6"/></radialGradient>
<radialGradient id="g2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFB3CB"/><stop offset="1" stop-color="#D6336C"/></radialGradient>
<radialGradient id="g3" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF5F8"/><stop offset="1" stop-color="#FFD0DF"/></radialGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9DBB"/><stop offset="1" stop-color="#F0628F"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE5A8F"/><stop offset="1" stop-color="#C9285F"/></linearGradient>
<linearGradient id="ll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD0DF"/><stop offset="1" stop-color="#FFA9C4"/></linearGradient>
<linearGradient id="lr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA9C4"/><stop offset="1" stop-color="#F57AA0"/></linearGradient>
<clipPath id="ct"><polygon points="150,74 238,116 150,158 62,116"/></clipPath>
<g id="bl"><path d="M0 0C-14-34-62-40-56-8-52 14-22 8 0 0Z" fill="url(#gold)" stroke="#D79A6A" stroke-width="1.5"/><path d="M-8-4C-20-22-44-26-44-10-42 0-24 2-8-4Z" fill="#D79A6A" opacity=".45"/></g>
<g id="st"><path d="M0-9L2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4Z" fill="#fff" stroke="#F6A5BE" stroke-width="1"/></g>
<g id="bow"><path d="M-2 4L-28 46-13 47 2 12Z" fill="url(#gold)" stroke="#D79A6A" stroke-width="1.2"/><path d="M2 4L28 46 13 47-2 12Z" fill="url(#gold)" stroke="#D79A6A" stroke-width="1.2"/><use href="#bl"/><use href="#bl" transform="scale(-1,1)"/><ellipse cx="0" cy="0" rx="12" ry="10" fill="url(#gold)" stroke="#D79A6A" stroke-width="1.5"/><ellipse cx="-3" cy="-3" rx="4" ry="3" fill="#fff" opacity=".6"/></g>
</defs></svg>

<section class="sc on" id="s1">
  <div class="big" aria-hidden="true">🌸</div>
  <h1>Gửi mẹ yêu</h1>
  <p class="sub">Có một chiếc rương may mắn đang chờ mẹ ở đây. Mẹ trả lời 3 câu hỏi để lấy mật mã mở rương nhé!</p>
  <button class="btn" id="go">Bắt đầu thôi</button>
</section>

<section class="sc" id="s2">
  <h2>Mở rương may mắn</h2>
  <div class="chest" id="chest"><div class="glow"></div><div class="lid"></div><div class="base"></div></div>
  <div class="dials" id="dials" aria-label="Mật mã rương"></div>
  <div class="qcard" id="qc"></div>
</section>

<section class="sc" id="s3">
  <h2>Chúc mừng mẹ ngày 20/10</h2>
  <p class="sub">Mẹ chạm vào từng món quà nhé</p>
  <div class="stageR">
    <button class="pick" id="pBq" aria-label="Bó hoa">
      <svg viewBox="0 10 300 350" id="svB"></svg><span>Bó hoa dành cho mẹ<br><small>Chạm vào nhé</small></span></button>
    <button class="pick" id="pGift" aria-label="Hộp quà">
      <svg viewBox="0 30 300 270" id="svG">
        <ellipse cx="150" cy="278" rx="104" ry="15" fill="rgba(214,51,108,.22)"/>
        <polygon points="70,148 150,186 150,276 70,238" fill="url(#gl)"/>
        <polygon points="150,186 230,148 230,238 150,276" fill="url(#gr)"/>
        <polygon points="102,163 118,171 118,261 102,253" fill="#F6D3B0"/>
        <polygon points="182,171 198,163 198,253 182,261" fill="#E3AE82"/>
        <g class="lid3" id="lid3">
          <polygon points="62,116 150,158 150,190 62,148" fill="url(#ll)"/>
          <polygon points="150,158 238,116 238,148 150,190" fill="url(#lr)"/>
          <polygon points="97,133 115,141 115,173 97,165" fill="#F6D3B0"/>
          <polygon points="185,141 203,133 203,165 185,173" fill="#E3AE82"/>
          <polygon points="150,74 238,116 150,158 62,116" fill="#FFDCE7"/>
          <g clip-path="url(#ct)"><path d="M106 95L194 137M194 95L106 137" stroke="#FBE3C4" stroke-width="18"/></g>
          <use href="#bow" transform="translate(150 114) scale(1.1)"/>
        </g>
      </svg><span>Hộp quà bí mật<br><small>Chạm vào nhé</small></span></button>
  </div>
</section>

<div id="hearts" aria-hidden="true"></div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Lá thư gửi mẹ">
  <div class="paper">
    <button class="x" id="cl" aria-label="Đóng">✕</button>
    <h2 id="lt"></h2><div id="lb"></div>
    <div class="photo"><div id="ph"></div></div>
  </div>
</div>

<script>
/* ============ CHỈNH NỘI DUNG TẠI ĐÂY ============ */
var QUIZ=[
 {q:"Câu hỏi 1 (thay bằng câu hỏi của bạn)",o:["Đáp án A","Đáp án B","Đáp án C","Đáp án D"],a:0,n:2},
 {q:"Câu hỏi 2 (thay bằng câu hỏi của bạn)",o:["Đáp án A","Đáp án B","Đáp án C","Đáp án D"],a:2,n:0},
 {q:"Câu hỏi 3 (thay bằng câu hỏi của bạn)",o:["Đáp án A","Đáp án B","Đáp án C","Đáp án D"],a:1,n:10}
];
var LETTER={
 title:"Mẹ yêu của con,",
 body:["Đây là nơi con sẽ viết lá thư gửi mẹ.","Nội dung thật sẽ được thay vào đây."],
 sign:"Con yêu mẹ nhiều lắm"
};
var PHOTO=""; /* dán ảnh dạng data:image/... vào đây */
/* ================================================ */

var $=function(i){return document.getElementById(i)};
function show(id){document.querySelectorAll('.sc').forEach(function(s){s.classList.remove('on')});$(id).classList.add('on');window.scrollTo(0,0)}
$('go').onclick=function(){show('s2');ask()};

var step=0,dials=$('dials');
QUIZ.forEach(function(){var d=document.createElement('div');d.className='dial';d.textContent='?';dials.appendChild(d)});

function ask(){
  var Q=QUIZ[step],c=$('qc');c.innerHTML='';
  var n=document.createElement('div');n.className='n';n.textContent='Câu '+(step+1)+' / '+QUIZ.length;
  var q=document.createElement('div');q.className='q';q.textContent=Q.q;c.append(n,q);
  Q.o.forEach(function(t,i){
    var b=document.createElement('button'),l=document.createElement('b');
    b.className='opt';l.textContent='ABCD'[i];b.append(l,document.createTextNode(t));
    b.onclick=function(){pick(i,b)};c.appendChild(b);
  });
  var m=document.createElement('div');m.className='msg';m.id='msg';c.appendChild(m);
}
function pick(i,b){
  var Q=QUIZ[step];
  if(i!==Q.a){b.classList.add('bad');$('msg').textContent='Chưa đúng rồi, mẹ thử lại nhé!';var ch=$('chest');ch.classList.remove('shake');void ch.offsetWidth;ch.classList.add('shake');return}
  b.classList.add('good');$('msg').textContent='Chính xác! Mẹ nhận được một con số.';
  document.querySelectorAll('.opt').forEach(function(o){o.disabled=true});
  roll(dials.children[step],Q.n,function(){
    step++;
    if(step<QUIZ.length)setTimeout(ask,500);else setTimeout(openChest,500);
  });
}
function roll(el,target,done){
  var v=0,t=setInterval(function(){el.textContent=v;if(v===target){clearInterval(t);el.classList.add('set');done()}else v=(v+1)%11},110);
}
function openChest(){
  $('qc').innerHTML='<div class="q" style="text-align:center">Mật mã 2 · 0 · 10 đã đúng!</div><div class="msg">Rương đang mở…</div>';
  $('chest').classList.add('open');
  setTimeout(function(){show('s3')},2300);
}

/* Vẽ bó hoa */
var NS='http://www.w3.org/2000/svg';
function E(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function rose(g,cx,cy,r,gi,rot){
  var f='url(#g'+gi+')',st='rgba(150,30,80,.28)';
  [[6,.52,.56],[5,.42,.34],[4,.32,.16]].forEach(function(l,i){
    for(var k=0;k<l[0];k++){
      var a=(k/l[0]*360+rot+i*30)*Math.PI/180;
      E('circle',{cx:cx+Math.cos(a)*r*l[2],cy:cy+Math.sin(a)*r*l[2],r:r*l[1],fill:f,stroke:st,'stroke-width':1.2},g);
    }
  });
  E('circle',{cx:cx,cy:cy,r:r*.22,fill:f,stroke:st,'stroke-width':1.2},g);
  E('path',{d:'M'+(cx-r*.09)+' '+cy+'a'+r*.09+' '+r*.09+' 0 1 1 '+r*.18+' 0a'+r*.06+' '+r*.06+' 0 1 1 '+(-r*.1)+' '+(-r*.03),fill:'none',stroke:st,'stroke-width':1.4,'stroke-linecap':'round'},g);
}
function star(svg,x,y,s,d){
  var g=E('g',{transform:'translate('+x+' '+y+') scale('+s+')'},svg);
  var u=E('use',{href:'#st',class:'stw'},g);u.style.animationDelay=d+'s';
}
(function(){
  var g=$('svB');
  [-165,-145,-125,-110,-70,-55,-35,-15].forEach(function(a,i){
    var s=1.9+(i%3)*.25,l=E('g',{transform:'translate(150 205) rotate('+a+') scale('+s+')'},g);
    E('path',{d:'M0 0C12-13 34-13 48 0C34 13 12 13 0 0Z',fill:'url(#leaf)'},l);
    E('path',{d:'M4 0L42 0',stroke:'rgba(255,255,255,.45)','stroke-width':.8},l);
  });
  [[40,112],[66,66],[112,40],[188,40],[234,66],[260,112],[22,152],[278,152],[150,26]].forEach(function(p){
    E('path',{d:'M150 210L'+p[0]+' '+p[1],stroke:'#6BAF7B','stroke-width':1.3,fill:'none'},g);
    [[0,0],[-6,7],[6,6]].forEach(function(o){E('circle',{cx:p[0]+o[0],cy:p[1]+o[1],r:4,fill:'#fff',stroke:'#FFD0DF','stroke-width':1},g)});
  });
  [[150,92,40,0,10],[96,112,38,1,30],[204,112,38,3,50],[60,158,36,2,20],[150,148,44,2,0],[240,158,36,0,40],[104,180,38,3,15],[196,180,38,1,35]]
    .forEach(function(r){rose(g,r[0],r[1],r[2],r[3],r[4])});
  E('path',{d:'M26 192Q150 216 274 192L188 340Q150 350 112 340Z',fill:'#F8A5C2'},g);
  E('path',{d:'M26 192Q90 210 150 216L150 348Q130 346 112 340Z',fill:'#FFF4F7'},g);
  E('path',{d:'M274 192Q210 210 150 216L150 348Q170 346 188 340Z',fill:'#F27FA6'},g);
  E('path',{d:'M150 216L150 348',stroke:'rgba(255,255,255,.55)','stroke-width':1.5},g);
  E('path',{d:'M26 192Q150 216 274 192',stroke:'#fff','stroke-width':3.5,fill:'none','stroke-linecap':'round',opacity:.85},g);
  E('path',{d:'M66 252Q150 276 234 252L228 270Q150 294 72 270Z',fill:'url(#gold)',stroke:'#D79A6A','stroke-width':1.2},g);
  E('use',{href:'#bow',transform:'translate(150 270) scale(.72)'},g);
  star(g,30,60,1,0);star(g,272,70,1.2,.8);star(g,250,230,.9,1.5);star(g,46,250,.8,.4);
  star($('svG'),44,92,1.1,0);star($('svG'),262,80,1.3,.9);star($('svG'),250,210,.9,1.6);star($('svG'),36,214,.8,.5);
})();

/* Trái tim rơi */
function rain(){
  var box=$('hearts'),ch=['♥','❤','♡'],col=['#FF8FB0','#F06595','#FFFFFF','#FFC2D4','#FFFFFF'];
  for(var i=0;i<100;i++)(function(i){setTimeout(function(){
    var h=document.createElement('span');h.className='h';h.textContent=ch[i%3];
    var d=3+Math.random()*3.5;
    h.style.cssText='left:'+Math.random()*100+'vw;font-size:'+(16+Math.random()*28)+'px;color:'+col[Math.floor(Math.random()*col.length)]+';animation-duration:'+d+'s;--r:'+(Math.random()*360-180)+'deg';
    box.appendChild(h);setTimeout(function(){h.remove()},d*1000+100);
  },i*45)})(i);
}
$('pBq').onclick=rain;

/* Thư + ảnh */
$('pGift').onclick=function(){
  var lid=$('lid3');lid.classList.add('pop');
  setTimeout(function(){
    $('lt').textContent=LETTER.title;
    var b=$('lb');b.innerHTML='';
    LETTER.body.forEach(function(t){var p=document.createElement('p');p.textContent=t;b.appendChild(p)});
    var s=document.createElement('p');s.className='sig';s.textContent=LETTER.sign;b.appendChild(s);
    var ph=$('ph');ph.innerHTML='';
    if(PHOTO){var im=new Image();im.alt='Ảnh kỷ niệm';im.src=PHOTO;ph.appendChild(im)}
    else{var d=document.createElement('div');d.className='ph';d.textContent='Ảnh kỷ niệm sẽ nằm ở đây';ph.appendChild(d)}
    $('ov').classList.add('on');rain();
  },550);
};
function closeOv(){$('ov').classList.remove('on');$('lid3').classList.remove('pop')}
$('cl').onclick=closeOv;
$('ov').onclick=function(e){if(e.target===this)closeOv()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeOv()});
</script>
